<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شعار مؤسسة النصر</title>
<style>
  :root { --bg: #ffffff; --fg: #2b2410; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 16px;
         background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; transition: background .3s; }
  body.dark { --bg: #0f0d08; --fg: #f3e6c0; }
  .logo { width: min(80vw, 520px); height: auto; }
  .bar { display: flex; gap: 8px; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid #d4a00a;
           background: transparent; color: inherit; cursor: pointer; }
</style>
</head>
<body>
  <img id="logo" class="logo" src="logo-animated.svg" alt="مؤسسة النصر للمحاماة">
  <div class="bar">
    <button onclick="replay()">إعادة التشغيل</button>
    <button onclick="document.body.classList.toggle('dark')">خلفية فاتحة / داكنة</button>
  </div>
<script>
  function replay() {
    const img = document.getElementById('logo');
    img.src = 'logo-animated.svg?t=' + Date.now();
  }
</script>
</body>
</html>
